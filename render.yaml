# Render.com Configuration for Laravel
# Dokumentasi: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: my-website-1
    runtime: php
    region: singapore
    plan: free
    buildCommand: ./scripts/render-build.sh
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false  # Set manually in Render dashboard
