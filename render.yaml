# Render.com Configuration for Laravel (Docker)
# Dokumentasi: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: naoval-dev
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Naoval Dev"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "https://naoval-dev.onrender.com"
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false  # Set manually in Render dashboard
